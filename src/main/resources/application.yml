spring:
  application:
    name: gramam-api
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gramam:
  schemes:
    # mock = built-in sample data; a real provider (e.g. myscheme) will be added later
    provider: mock
